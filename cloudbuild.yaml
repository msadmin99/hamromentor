steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'asia-south1-docker.pkg.dev/hamromentor-app/hamromentor-repo/frontend:$COMMIT_SHA', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-south1-docker.pkg.dev/hamromentor-app/hamromentor-repo/frontend:$COMMIT_SHA']
  - name: 'gcr.io/google-cloud-sdk/slim'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - hamromentor-frontend
      - --image=asia-south1-docker.pkg.dev/hamromentor-app/hamromentor-repo/frontend:$COMMIT_SHA
      - --region=asia-south1
      - --platform=managed
      - --allow-unauthenticated
images:
  - 'asia-south1-docker.pkg.dev/hamromentor-app/hamromentor-repo/frontend:$COMMIT_SHA'
options:
  logging: CLOUD_LOGGING_ONLY
